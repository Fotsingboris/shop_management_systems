<svg viewBox="0 0 1980 1850" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, sans-serif">
<title>Diagramme de classes — Système de Gestion de Boutique (v2, avec Client)</title>
<desc>Diagramme de classes UML avec BaseModel, hiérarchie Utilisateur/Admin/ResponsableAgence/Caissier, classes du domaine (Agence, Categorie, Produit, ProduitAgence, TransfertStock, Client, Commande, LigneCommande, Recu, ParametresEntreprise) et leurs associations. Client est optionnel sur Commande.</desc>

<defs>
  <marker id="gen" viewBox="0 0 20 16" refX="19" refY="8" markerWidth="18" markerHeight="15" orient="auto-start-reverse">
    <path d="M1,1 L19,8 L1,15 Z" fill="#fff" stroke="#111" stroke-width="1.3"/>
  </marker>
</defs>

<g>
  <rect x="560" y="40" width="260" height="104" fill="#eef2f7" stroke="#555" stroke-width="1.5"/>
  <text x="690" y="58" text-anchor="middle" font-size="12" font-style="italic" fill="#555">«abstract»</text>
  <text x="690" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#111">BaseModel</text>
  <line x1="560" y1="84" x2="820" y2="84" stroke="#555"/>
  <text x="572" y="100" font-size="12.5" fill="#111">id : UUID</text>
  <text x="572" y="118" font-size="12.5" fill="#111">created_at : DateTime</text>
  <text x="572" y="136" font-size="12.5" fill="#111">updated_at : DateTime</text>
</g>

<g>
  <path d="M860 40 H1240 V130 H900 L860 115 Z" fill="#fafafa" stroke="#999" stroke-dasharray="4,3" stroke-width="1.3"/>
