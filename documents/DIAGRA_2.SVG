  <text x="1050" y="83" text-anchor="middle" font-size="12.5" fill="#555">héritent de BaseModel (id, created_at,</text>
  <text x="1050" y="101" text-anchor="middle" font-size="12.5" fill="#555">updated_at) — non répété sur chaque classe.</text>
  <line x1="860" y1="90" x2="820" y2="90" stroke="#999" stroke-dasharray="4,3"/>
</g>

<g>
  <rect x="1040" y="220" width="260" height="70" fill="#fafafa" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3"/>
