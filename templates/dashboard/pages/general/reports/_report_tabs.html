{# Onglets partagés entre les deux rapports (inventaire.html / ventes.html). #}
<div class="flex gap-1 border-b border-gray-200">
  <a href="{% url 'general:rapport_inventaire' %}"
     class="border-b-2 px-4 py-2.5 text-sm font-medium {% if vue_active == 'inventaire' %}border-primary-800 text-primary-800{% else %}border-transparent text-gray-500 hover:text-gray-700{% endif %}">
    Inventaire
  </a>
  <a href="{% url 'general:rapport_ventes' %}"
     class="border-b-2 px-4 py-2.5 text-sm font-medium {% if vue_active == 'ventes' %}border-primary-800 text-primary-800{% else %}border-transparent text-gray-500 hover:text-gray-700{% endif %}">
    Ventes
  </a>
</div>
