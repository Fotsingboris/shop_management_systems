{% load static %}

<header class="sticky top-0 z-20 flex h-16 shrink-0 items-center gap-3 border-b border-gray-200 bg-white px-4 sm:px-6">
        <button id="mobileMenuBtn" type="button" aria-label="Ouvrir le menu" aria-expanded="false"
          class="-ml-1 flex h-9 w-9 items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100 lg:hidden">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" /></svg>
        </button>

        <h1 class="truncate text-base font-semibold text-gray-900 sm:text-lg">
          {% block page_title %}Tableau de bord{% endblock %}
        </h1>

        <div class="ml-auto flex items-center gap-2 sm:gap-3">

          <!-- Agency switcher -->
          <button type="button" class="hidden items-center gap-2 rounded-lg border border-gray-200 px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-50 sm:flex">
            <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18" /></svg>
            <span>{% block current_branch %}Agence principale{% endblock %}</span>
            <svg class="h-3.5 w-3.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
          </button>

          <!-- Notifications -->
          <button type="button" aria-label="Notifications" class="relative flex h-9 w-9 items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" /></svg>
            <span class="absolute right-1.5 top-1.5 h-2 w-2 rounded-full bg-secondary-500"></span>
          </button>

          <!-- User menu -->
          <div class="relative">
            <button id="userMenuBtn" type="button" aria-expanded="false"
              class="flex items-center gap-2 rounded-lg py-1 pl-1 pr-2 hover:bg-gray-100">
              <span class="flex h-8 w-8 items-center justify-center rounded-full bg-primary-800 text-xs font-semibold text-white">
                {% block user_initials %}U{% endblock %}
              </span>
              <span class="hidden text-left sm:block">
                <span class="block text-sm font-medium text-gray-900">{% block user_name %}Utilisateur{% endblock %}</span>
                <span class="block text-xs text-gray-500">{% block user_role %}Caissier{% endblock %}</span>
              </span>
              <svg class="hidden h-4 w-4 text-gray-400 sm:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
            </button>
            <div id="userMenu" class="absolute right-0 z-30 mt-2 hidden w-48 rounded-lg border border-gray-100 bg-white py-1 shadow-lg">
              <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Mon profil</a>
              <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Paramètres</a>
              <div class="my-1 border-t border-gray-100"></div>
              <a href="#" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50">Déconnexion</a>
            </div>
          </div>
        </div>
      </header>
